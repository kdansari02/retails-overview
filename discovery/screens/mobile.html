<!doctype html>
<!--
  DISCOVERY SCREEN — Foodbridge Module Retails — "Mobile"
  Standalone-openable: open this file directly (or via QR/link) to land straight
  in Shop, no login wall. Also reachable from the wiring hub (../index.html).
  One page, three in-place views (Shop / Orders / Profile) switched by the
  bottom tab bar; Company Info, Review Order and Order Detail are bottom-sheet
  overlays over whichever view is active — never separate pages (Addendum 002).
  Rules: HTML/CSS/vanilla JS only. No frameworks, no build step, no real API
  calls. Data from ../seed-data/seed.json. Disposable — informs the SSOTs,
  not imported by development/.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Role Play Wholesale — Mobile</title>
<style>
  :root {
    color-scheme: light;
    --brand: #17a34a;
    --brand-dark: #128a43;
    --brand-tint: #e8f7ee;
    --ink: #16181d;
    --muted: #7a8291;
    --line: #ececef;
    --bg: #f3f4f6;
    --card: #ffffff;
    --amber-bg: #fef3c7; --amber-fg: #92680b;
    --blue-bg: #dbeafe; --blue-fg: #1d4ed8;
    --green-bg: #d9f5e3; --green-fg: #0f7a3d;
    --danger: #dc2626;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #d9dbe0;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .stage { min-height: 100vh; display: flex; justify-content: center; }
  .device {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  @media (min-width: 431px) {
    .stage { align-items: flex-start; padding: 32px 0; }
    .device { min-height: 844px; max-height: 844px; border-radius: 40px; box-shadow: 0 30px 60px rgba(0,0,0,.35); border: 8px solid #111; }
  }

  .statusbar { display: none; }
  @media (min-width: 431px) {
    .statusbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 22px 2px; font-size: 13px; font-weight: 600; color: var(--ink); flex: none; }
    .statusbar .dots { display: flex; gap: 4px; align-items: center; }
  }

  header.topbar {
    flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 10px;
    background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 10px; background: var(--brand);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px;
    flex: none;
  }
  .brand .name { font-weight: 700; font-size: 16px; letter-spacing: -0.2px; }
  .info-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--brand);
    background: #fff; color: var(--brand); font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .info-btn:active { background: var(--brand-tint); }

  nav.tabbar {
    flex: none;
    display: flex; padding: 8px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    background: var(--card); border-top: 1px solid var(--line);
  }
  nav.tabbar button {
    flex: 1; background: none; border: none; padding: 6px 0 4px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--muted); font-size: 12.5px; font-weight: 600; font-family: inherit;
  }
  nav.tabbar button .dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  nav.tabbar button.active { color: var(--brand); }
  nav.tabbar button.active .dot { background: var(--brand); }
  .home-indicator { width: 120px; height: 4px; background: #d0d2d8; border-radius: 3px; margin: 6px auto 0; }

  main.view { flex: 1; overflow-y: auto; padding: 0 16px 16px; -webkit-overflow-scrolling: touch; }
  main.view.hidden { display: none; }

  .search-bar {
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 12px; color: var(--muted);
  }
  .search-bar svg { flex: none; }
  .search-bar input { border: none; outline: none; flex: 1; font-size: 14.5px; font-family: inherit; background: transparent; color: var(--ink); }

  .pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
  .pills::-webkit-scrollbar { display: none; }
  .pill {
    flex: none; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .pill.active { background: var(--brand); border-color: var(--brand); color: #fff; }

  .product-card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px; margin-bottom: 12px; display: grid; grid-template-columns: 56px 1fr; gap: 12px;
  }
  .thumb {
    width: 56px; height: 56px; border-radius: 10px;
    background: repeating-linear-gradient(45deg, #eef0f3, #eef0f3 6px, #e4e6ea 6px, #e4e6ea 12px);
  }
  .p-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .p-name { font-weight: 700; font-size: 14.5px; }
  .p-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .p-price { font-weight: 700; font-size: 14.5px; white-space: nowrap; }
  .p-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: #fff;
    font-size: 16px; line-height: 1; cursor: pointer; color: var(--ink);
  }
  .stepper button.plus { background: var(--brand); border-color: var(--brand); color: #fff; }
  .stepper .qty { min-width: 20px; text-align: center; font-weight: 700; font-size: 14px; }
  .p-side { text-align: right; font-size: 11.5px; }
  .p-avail { color: #b45309; font-weight: 600; }
  .p-total { color: var(--brand-dark); font-weight: 700; margin-top: 2px; }

  .empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 14px; }

  .section-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin: 14px 0 10px; text-transform: uppercase; }

  .order-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
  .order-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .order-id { font-weight: 700; font-size: 14.5px; }
  .order-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .status-pill { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .status-delivered { background: var(--green-bg); color: var(--green-fg); }
  .status-outfordelivery { background: var(--blue-bg); color: var(--blue-fg); }
  .status-processing { background: var(--amber-bg); color: var(--amber-fg); }
  .order-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .order-total { font-weight: 700; font-size: 15px; }
  .view-details { color: var(--brand-dark); font-weight: 700; font-size: 13px; background: none; border: none; cursor: pointer; font-family: inherit; padding: 0; }

  .profile-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: flex; gap: 12px; align-items: center; margin-bottom: 4px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-tint); color: var(--brand-dark); display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
  .profile-name { font-weight: 700; font-size: 15px; }
  .profile-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

  .credit-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 4px; }
  .credit-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
  .credit-row .used { color: var(--muted); }
  .bar-track { height: 8px; border-radius: 999px; background: #e7e9ed; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--brand); border-radius: 999px; }

  .addr-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; }
  .addr-label { font-weight: 700; font-size: 14px; }
  .addr-detail { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .badge-default { font-size: 10.5px; font-weight: 700; color: var(--green-fg); background: var(--green-bg); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }

  .payment-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; font-weight: 700; font-size: 14px; margin-bottom: 18px; }

  .logout-btn { display: block; width: 100%; background: none; border: none; color: var(--danger); font-weight: 700; font-size: 14.5px; padding: 10px; cursor: pointer; font-family: inherit; }

  .cart-bar {
    position: absolute; left: 16px; right: 16px; bottom: 78px;
    background: #16181d; color: #fff; border-radius: 16px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 24px rgba(0,0,0,.3);
    z-index: 20;
  }
  .cart-bar.hidden { display: none; }
  .cart-bar .count { font-size: 12.5px; color: #cfd2d8; }
  .cart-bar .total { font-weight: 700; font-size: 16px; }
  .cart-bar button {
    background: var(--brand); color: #fff; border: none; border-radius: 10px; padding: 10px 16px;
    font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: inherit;
  }

  .backdrop {
    position: absolute; inset: 0; background: rgba(20,22,26,.55); z-index: 30; opacity: 0;
    transition: opacity .2s ease; pointer-events: none;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 31;
    background: #fff; border-radius: 20px 20px 0 0; padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    max-height: 82%; overflow-y: auto;
    transform: translateY(100%); transition: transform .25s cubic-bezier(.32,.72,0,1);
    box-shadow: 0 -8px 30px rgba(0,0,0,.2);
  }
  .sheet.show { transform: translateY(0); }
  .sheet .handle { width: 40px; height: 5px; background: #e2e4e8; border-radius: 3px; margin: 8px auto 14px; }

  .sheet h2 { font-size: 17px; margin: 0 0 4px; }
  .sheet .muted { color: var(--muted); font-size: 12.5px; }
  .sheet-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .sheet-row:last-of-type { border-bottom: none; }
  .sheet-label { font-size: 11px; font-weight: 700; letter-spacing: .05em; color: var(--muted); text-transform: uppercase; margin-top: 14px; }
  .sheet-value { font-size: 14px; font-weight: 600; margin-top: 3px; }

  .company-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .company-logo { width: 44px; height: 44px; border-radius: 12px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
  .rating { color: #b45309; font-weight: 700; font-size: 13.5px; margin-bottom: 8px; }
  .rating span.reviews { color: var(--muted); font-weight: 500; }

  .btn-row { display: flex; gap: 10px; margin-top: 18px; }
  .btn { flex: 1; border: none; border-radius: 12px; padding: 13px; font-weight: 700; font-size: 14.5px; cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-secondary { background: #f0f1f3; color: var(--ink); }
  .btn.full { width: 100%; }

  .timeline { margin: 14px 0; }
  .t-step { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13.5px; font-weight: 600; }
  .t-dot { width: 10px; height: 10px; border-radius: 50%; background: #e2e4e8; flex: none; }
  .t-step.done .t-dot { background: var(--brand); }
  .t-step.done { color: var(--ink); }
  .t-step:not(.done) { color: var(--muted); }

  .status-note { font-size: 11.5px; padding: 4px 10px; border-radius: 999px; font-weight: 700; }

  .toast {
    position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%);
    background: #16181d; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13.5px;
    z-index: 40; opacity: 0; transition: opacity .25s ease, transform .25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="stage">
  <div class="device" id="device">
    <div class="statusbar">
      <span>9:41</span>
      <div class="dots"><span>●●●●</span></div>
    </div>

    <header class="topbar">
      <div class="brand">
        <span class="logo">🛍</span>
        <span class="name" id="brandName">Role Play Wholesale</span>
      </div>
      <button class="info-btn" id="infoBtn" title="Company info">i</button>
    </header>

    <!-- SHOP -->
    <main class="view" id="view-shop">
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search products..." />
      </div>
      <div class="pills" id="pills"></div>
      <div id="productList"></div>
    </main>

    <!-- ORDERS -->
    <main class="view hidden" id="view-orders">
      <div class="section-label">Order history</div>
      <div id="orderList"></div>
    </main>

    <!-- PROFILE -->
    <main class="view hidden" id="view-profile">
      <div class="profile-card">
        <div class="avatar" id="profileInitials"></div>
        <div>
          <div class="profile-name" id="profileName"></div>
          <div class="profile-sub" id="profileSub"></div>
        </div>
      </div>
      <div class="section-label">Credit</div>
      <div class="credit-card">
        <div class="credit-row"><span class="used">Used</span><span id="creditText"></span></div>
        <div class="bar-track"><div class="bar-fill" id="creditFill"></div></div>
      </div>
      <div class="section-label">Saved addresses</div>
      <div id="addressList"></div>
      <div class="section-label">Payment</div>
      <div class="payment-card" id="paymentCard"></div>
      <button class="logout-btn" id="logoutBtn">Log Out</button>
    </main>

    <!-- Floating cart bar -->
    <div class="cart-bar hidden" id="cartBar">
      <div>
        <div class="count" id="cartCount">0 items</div>
        <div class="total" id="cartTotal">₹0.00</div>
      </div>
      <button id="reviewOrderBtn">Review Order</button>
    </div>

    <nav class="tabbar">
      <button class="tab active" data-view="shop"><span class="dot"></span>Shop</button>
      <button class="tab" data-view="orders"><span class="dot"></span>Orders</button>
      <button class="tab" data-view="profile"><span class="dot"></span>Profile</button>
    </nav>
    <div class="home-indicator"></div>

    <!-- Overlays -->
    <div class="backdrop" id="backdrop"></div>

    <div class="sheet" id="companySheet">
      <div class="handle"></div>
      <div class="company-head">
        <div class="company-logo">🛍</div>
        <div>
          <h2 id="companyName"></h2>
          <div class="muted" id="companyTagline"></div>
        </div>
      </div>
      <div class="rating" id="companyRating"></div>
      <div class="sheet-label">Address</div>
      <div class="sheet-value" id="companyAddress"></div>
      <div class="sheet-label">Contact</div>
      <div class="sheet-value" id="companyContact"></div>
      <div class="sheet-label">Hours</div>
      <div class="sheet-value" id="companyHours"></div>
      <div class="sheet-label">GST</div>
      <div class="sheet-value" id="companyGst"></div>
      <div class="btn-row"><button class="btn btn-secondary full" data-close>Close</button></div>
    </div>

    <div class="sheet" id="reviewSheet">
      <div class="handle"></div>
      <h2>Review Order</h2>
      <div id="reviewLines"></div>
      <div class="sheet-row" style="font-weight:700; font-size:16px; border:none; margin-top:6px;">
        <span>Total</span><span id="reviewTotal"></span>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" data-close>Back to Shop</button>
        <button class="btn btn-primary" id="placeOrderBtn">Place Order</button>
      </div>
    </div>

    <div class="sheet" id="orderDetailSheet">
      <div class="handle"></div>
      <div class="order-top">
        <div>
          <h2 id="odId"></h2>
          <div class="muted" id="odDate"></div>
        </div>
        <span class="status-pill" id="odStatus"></span>
      </div>
      <div class="timeline" id="odTimeline"></div>
      <div id="odLines"></div>
      <div class="sheet-row" style="font-weight:700; font-size:16px; border:none;">
        <span>Total</span><span id="odTotal"></span>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" data-close>Close</button>
        <button class="btn btn-primary" id="odInvoiceBtn">Invoice · Reorder</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
const fmt = (n) => '₹' + Number(n).toFixed(2);
const statusClass = (s) => 'status-' + s.toLowerCase().replace(/\s+/g, '');

let seed = null;
let activeCategory = 'all';
let searchTerm = '';
const cart = {}; // productId -> qty

function el(id) { return document.getElementById(id); }

fetch('../seed-data/seed.json')
  .then((r) => r.json())
  .then((data) => { seed = data; init(); });

function init() {
  el('brandName').textContent = seed.company.name;
  renderCompanySheet();
  renderPills();
  renderProducts();
  renderOrders();
  renderProfile();
  wireEvents();
}

function renderCompanySheet() {
  const c = seed.company;
  el('companyName').textContent = c.name;
  el('companyTagline').textContent = c.tagline;
  el('companyRating').innerHTML = `★ ${c.rating} <span class="reviews">(${c.reviews} reviews)</span>`;
  el('companyAddress').textContent = c.address;
  el('companyContact').textContent = `${c.phone} · ${c.email}`;
  el('companyHours').textContent = c.hours;
  el('companyGst').textContent = c.gst;
}

function renderPills() {
  const wrap = el('pills');
  wrap.innerHTML = seed.categories.map((c) =>
    `<button class="pill ${c.id === activeCategory ? 'active' : ''}" data-cat="${c.id}">${c.label}</button>`
  ).join('');
  wrap.querySelectorAll('.pill').forEach((btn) => {
    btn.addEventListener('click', () => { activeCategory = btn.dataset.cat; renderPills(); renderProducts(); });
  });
}

function filteredProducts() {
  return seed.products.filter((p) => {
    const inCat = activeCategory === 'all' || p.category === activeCategory;
    const inSearch = !searchTerm || p.name.toLowerCase().includes(searchTerm);
    return inCat && inSearch;
  });
}

function renderProducts() {
  const list = filteredProducts();
  const wrap = el('productList');
  if (!list.length) {
    wrap.innerHTML = '<div class="empty">No products match your search.</div>';
    return;
  }
  wrap.innerHTML = list.map((p) => {
    const qty = cart[p.id] || 0;
    const lineTotal = qty * p.price;
    return `
    <div class="product-card" data-id="${p.id}">
      <div class="thumb"></div>
      <div>
        <div class="p-head">
          <div>
            <div class="p-name">${p.name}</div>
            <div class="p-meta">Art No: ${p.artNo} · ${p.unit}</div>
          </div>
          <div class="p-price">${fmt(p.price)}</div>
        </div>
        <div class="p-foot">
          <div class="stepper">
            <button class="minus" data-id="${p.id}">−</button>
            <span class="qty" id="qty-${p.id}">${qty}</span>
            <button class="plus" data-id="${p.id}">+</button>
          </div>
          <div class="p-side">
            <div class="p-avail">${p.available} avail.</div>
            <div class="p-total" id="total-${p.id}">${fmt(lineTotal)}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.plus').forEach((b) => b.addEventListener('click', () => changeQty(b.dataset.id, 1)));
  wrap.querySelectorAll('.minus').forEach((b) => b.addEventListener('click', () => changeQty(b.dataset.id, -1)));
}

function changeQty(id, delta) {
  const product = seed.products.find((p) => p.id === id);
  const next = Math.max(0, Math.min(product.available, (cart[id] || 0) + delta));
  if (next === 0) delete cart[id]; else cart[id] = next;
  const qtyEl = el('qty-' + id);
  const totalEl = el('total-' + id);
  if (qtyEl) qtyEl.textContent = next;
  if (totalEl) totalEl.textContent = fmt(next * product.price);
  updateCartBar();
}

function cartLines() {
  return Object.entries(cart).map(([id, qty]) => {
    const p = seed.products.find((x) => x.id === id);
    return { name: p.name, qty, price: p.price, total: qty * p.price };
  });
}

function updateCartBar() {
  const lines = cartLines();
  const count = lines.reduce((s, l) => s + l.qty, 0);
  const total = lines.reduce((s, l) => s + l.total, 0);
  const bar = el('cartBar');
  if (count === 0) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  el('cartCount').textContent = `${count} item${count === 1 ? '' : 's'}`;
  el('cartTotal').textContent = fmt(total);
}

function renderReviewSheet() {
  const lines = cartLines();
  el('reviewLines').innerHTML = lines.map((l) =>
    `<div class="sheet-row"><span>${l.name} × ${l.qty}</span><span>${fmt(l.total)}</span></div>`
  ).join('');
  el('reviewTotal').textContent = fmt(lines.reduce((s, l) => s + l.total, 0));
}

function renderOrders() {
  const wrap = el('orderList');
  if (!seed.orders.length) { wrap.innerHTML = '<div class="empty">No orders yet.</div>'; return; }
  wrap.innerHTML = seed.orders.slice().reverse().map((o) => `
    <div class="order-card" data-id="${o.id}">
      <div class="order-top">
        <div>
          <div class="order-id">${o.id}</div>
          <div class="order-meta">${o.date} · ${o.items.length} items</div>
        </div>
        <span class="status-pill ${statusClass(o.status)}">${o.status}</span>
      </div>
      <div class="order-bottom">
        <div class="order-total">${fmt(o.total)}</div>
        <button class="view-details" data-id="${o.id}">View details ›</button>
      </div>
    </div>`).join('');
  wrap.querySelectorAll('.view-details').forEach((b) => b.addEventListener('click', () => openOrderDetail(b.dataset.id)));
}

function openOrderDetail(id) {
  const o = seed.orders.find((x) => x.id === id);
  el('odId').textContent = o.id;
  el('odDate').textContent = o.date;
  const pill = el('odStatus');
  pill.textContent = o.status;
  pill.className = 'status-pill ' + statusClass(o.status);
  el('odTimeline').innerHTML = o.timeline.map((t) =>
    `<div class="t-step ${t.done ? 'done' : ''}"><span class="t-dot"></span>${t.step}</div>`
  ).join('');
  el('odLines').innerHTML = o.items.map((i) =>
    `<div class="sheet-row"><span>${i.name} × ${i.qty}</span><span>${fmt(i.total)}</span></div>`
  ).join('');
  el('odTotal').textContent = fmt(o.total);
  openSheet('orderDetailSheet');
}

function renderProfile() {
  const p = seed.profile;
  el('profileInitials').textContent = p.initials;
  el('profileName').textContent = p.businessName;
  el('profileSub').textContent = `${p.contactName} · Member since ${p.memberSince}`;
  el('creditText').textContent = `${fmt(p.credit.used)} / ${fmt(p.credit.limit)}`;
  el('creditFill').style.width = Math.min(100, (p.credit.used / p.credit.limit) * 100) + '%';
  el('addressList').innerHTML = p.addresses.map((a) => `
    <div class="addr-card">
      <div>
        <div class="addr-label">${a.label}</div>
        <div class="addr-detail">${a.detail}</div>
      </div>
      ${a.default ? '<span class="badge-default">DEFAULT</span>' : ''}
    </div>`).join('');
  el('paymentCard').textContent = `${p.payment.method} · ${p.payment.handle}`;
}

function switchView(view) {
  ['shop', 'orders', 'profile'].forEach((v) => {
    el('view-' + v).classList.toggle('hidden', v !== view);
  });
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.view === view));
}

function openSheet(id) {
  el('backdrop').classList.add('show');
  el(id).classList.add('show');
}
function closeSheets() {
  el('backdrop').classList.remove('show');
  document.querySelectorAll('.sheet').forEach((s) => s.classList.remove('show'));
}

function showToast(msg) {
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function wireEvents() {
  el('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderProducts();
  });

  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => switchView(t.dataset.view)));

  el('infoBtn').addEventListener('click', () => openSheet('companySheet'));
  el('reviewOrderBtn').addEventListener('click', () => { renderReviewSheet(); openSheet('reviewSheet'); });
  el('backdrop').addEventListener('click', closeSheets);
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeSheets));

  el('placeOrderBtn').addEventListener('click', () => {
    const lines = cartLines();
    if (!lines.length) return;
    const total = lines.reduce((s, l) => s + l.total, 0);
    const id = 'PO-' + Math.floor(10000 + Math.random() * 89999);
    seed.orders.push({
      id,
      date: new Date().toISOString().slice(0, 10),
      status: 'Processing',
      total,
      items: lines.map((l) => ({ name: l.name, qty: l.qty, unit: 'Bottle', price: l.price, total: l.total })),
      timeline: [
        { step: 'Order Placed', done: true },
        { step: 'Packed', done: false },
        { step: 'Out for Delivery', done: false },
        { step: 'Delivered', done: false }
      ]
    });
    Object.keys(cart).forEach((k) => delete cart[k]);
    updateCartBar();
    renderProducts();
    renderOrders();
    closeSheets();
    switchView('orders');
    showToast(`Order ${id} placed`);
  });

  el('odInvoiceBtn').addEventListener('click', () => showToast('Invoice sent · Items added back to cart'));
  el('logoutBtn').addEventListener('click', () => showToast('Logged out (demo only)'));
}
</script>
