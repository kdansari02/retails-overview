<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gupta Wholesale Store — Desktop (V4)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  #app { display: block; width: 100%; height: 100%; margin: 0; border: 0; background:#fff; }
  .vsw { position: fixed; left: 20px; bottom: 20px; z-index: 20; display:flex; gap:2px; padding:4px; border-radius:999px; background:#16181d; box-shadow:0 8px 20px rgba(0,0,0,.28); font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .vsw a { padding:7px 12px; border-radius:999px; color:#c8cbd2; text-decoration:none; }
  .vsw a.active { color:#fff; background:#17a34a; }
  .vsw a.home { color:#8b90a0; padding-inline:10px; }
</style>
</head>
<body>
<iframe id="app" src="desktop-v3.html" title="FoodBridge Retail V4"></iframe>
<nav class="vsw" aria-label="UI version">
  <a class="home" href="../index.html">⌂</a><a href="desktop.html">V1</a><a href="desktop-v2.html">V2</a><a href="desktop-v3.html">V3</a><a class="active" href="desktop-v4.html">V4</a><a href="desktop-v5.html">V5</a>
</nav>
<script>
const frame = document.getElementById('app');
if (location.hash) frame.src = 'desktop-v3.html' + location.hash;
frame.addEventListener('load', () => {
  const doc = frame.contentDocument;
  const win = frame.contentWindow;
  const enhance = () => {
  if (!doc.querySelector('#ordersBody tr')) { setTimeout(enhance, 50); return; }
  doc.querySelector('.vsw-wrap')?.remove();
  const style = doc.createElement('style');
  style.textContent = `
    #view-purchases .v4-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:22px}
    #view-purchases .v4-stat{height:132px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:24px 20px 20px 120px;position:relative}
    #view-purchases .v4-stat .v4-icon{position:absolute;left:28px;top:24px;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#edf8ee;color:#149447}
    #view-purchases .v4-stat .v4-icon svg{width:34px;height:34px}
    #view-purchases .v4-stat .label{font-size:14px;color:var(--muted)}
    #view-purchases .v4-stat .value{font-size:25px;font-weight:700;margin-top:5px}
    #view-purchases .v4-stat .note{font-size:12px;color:var(--muted);margin-top:6px}
    #view-purchases .v4-stat .note.green{color:var(--brand-dark)}
    #view-purchases .v4-layout{display:grid;grid-template-columns:minmax(0,1fr) 365px;gap:22px}
    #view-purchases .v4-orders,#view-purchases .v4-help{border:1px solid var(--line);border-radius:12px;background:#fff}
    #view-purchases .v4-toolbar{height:74px;display:flex;align-items:center;gap:22px;padding:0 20px;border-bottom:1px solid var(--line)}
    #view-purchases .v4-filter{border:0;background:transparent;padding:12px 20px;font:500 14px inherit;cursor:pointer;border-radius:9px}
    #view-purchases .v4-filter.active{background:var(--brand);color:#fff}
    #view-purchases .v4-search{margin-left:auto;width:330px;height:44px;border:1px solid var(--line);border-radius:9px;padding:0 14px;font:14px inherit}
    #view-purchases .v4-filter-btn{height:44px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 18px;font:600 14px inherit;cursor:pointer}
    #view-purchases .v4-table{width:100%;border-collapse:separate;border-spacing:0;padding:0 20px}
    #view-purchases .v4-table th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;padding:14px 16px}
    #view-purchases .v4-table td{padding:13px 16px;border-top:1px solid var(--line);font-size:14px}
    #view-purchases .v4-table tr.order-row td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px}
    #view-purchases .v4-table tr.order-row td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
    #view-purchases .v4-table .sub{font-size:12px;color:var(--muted);margin-top:3px}
    #view-purchases .v4-status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:12px}
    #view-purchases .v4-status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
    #view-purchases .delivered{background:#e5f7eb;color:#159447}.active-order{background:#e8f2ff;color:#1680ff}.pending{background:#fff2df;color:#f47a10}.cancelled{background:#eef0f3;color:#5b6575}
    #view-purchases .v4-action{min-width:142px;border:1px solid #29a855;border-radius:8px;background:#fff;color:#168c42;padding:9px 14px;font:600 13px inherit;cursor:pointer}
    #view-purchases .v4-view-all{display:block;margin:12px auto 18px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 28px;font:500 13px inherit;cursor:pointer}
    #view-purchases .v4-help{padding:22px}
    #view-purchases .v4-help h3{margin:0;font-size:16px}#view-purchases .v4-help>p{margin:7px 0 18px;color:var(--muted);font-size:13px}
    #view-purchases .v4-help-card{border:1px solid var(--line);border-radius:10px;padding:0 15px}
    #view-purchases .v4-help-row{display:flex;align-items:center;gap:14px;min-height:91px;border-bottom:1px solid var(--line);cursor:pointer}
    #view-purchases .v4-help-row:last-child{border:0}
    #view-purchases .v4-help-row .circle{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#edf8ee;color:#159447;flex:none}
    #view-purchases .v4-help-row:nth-child(2) .circle{background:#fff1e7;color:#ff6a00}
    #view-purchases .v4-help-row svg{width:24px;height:24px}.v4-help-row strong{font-size:14px}.v4-help-row small{display:block;color:var(--muted);line-height:18px;margin-top:3px}.v4-help-row b{margin-left:auto}
    #view-purchases .v4-trust{height:78px;margin-top:18px;border-radius:10px;background:#f1faec;display:flex;align-items:center;justify-content:center;gap:16px;color:#168c42;font-size:13px}
    @media(max-width:1200px){#view-purchases .v4-stats{grid-template-columns:repeat(2,1fr)}#view-purchases .v4-layout{grid-template-columns:1fr}#view-purchases .v4-search{width:240px}}
    #view-payments .stat-card::after{display:none!important}
    #view-payments .v4-pay-icon{position:absolute;left:25px;top:23px;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:#edf8ee;color:#159447;z-index:2}
    #view-payments .stat-card:nth-child(3) .v4-pay-icon{background:#fff0ec;color:#ff341d}
    #view-payments .v4-pay-icon svg{width:38px;height:38px}
    #view-payments .stat-card .lbl{font-size:15px!important;color:#16181d!important}
    #view-payments .stat-card .val{font-size:26px!important;line-height:1.15}
    #view-payments .stat-card .delta,#view-payments .stat-card .chip{font-size:12px!important}
    #view-payments .panel-head h3{font-size:16px!important}
    #view-payments table.paytable th{font-size:13px!important;color:#667085!important}
    #view-payments table.paytable td{font-size:14px!important;padding-block:11px!important}
    #view-payments .mode-icon{display:inline-flex;width:23px;height:23px;align-items:center;justify-content:center;margin-right:9px;vertical-align:middle;color:#526174}
    #view-payments .mode-icon svg{width:20px;height:20px}
    #view-payments .mode-icon.upi{color:#12a652}
    #view-payments .secure-note{display:flex;align-items:center;gap:10px;color:#667085;font-size:12px;padding:13px 3px 0}
    #view-payments .secure-note svg{width:17px;height:17px}
    #view-payments .balance-card{text-align:left!important;padding:24px 26px!important}
    #view-payments .balance-label{font-size:13px;color:#667085;margin-top:14px}
    #view-payments .balance-total{font-size:32px!important;margin-top:6px!important}
    #view-payments .balance-due-note{font-size:13px!important;display:flex;align-items:center;gap:8px}
    #view-payments .balance-due-note svg{width:17px;height:17px}
    #view-payments .pay-or{display:flex;align-items:center;gap:14px;color:#667085;font-size:13px;margin:12px 0 4px}
    #view-payments .pay-or:before,#view-payments .pay-or:after{content:"";height:1px;background:#dfe5e1;flex:1}
    #view-payments .btn{font-size:14px!important}
    #view-payments .help-row .t{font-size:13px!important}
    #view-payments .help-row .s{font-size:12px!important}
    .top-actions .action-btn{font-size:15px!important}
    .top-actions .action-btn:nth-child(2) .ui-icon{color:#16a34a}
  `;
  doc.head.appendChild(style);
  const purchases = doc.getElementById('view-purchases');
  const svg = (path) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
  const icons = {
    wallet: svg('<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 12h5M7 6V4h10v2"/>'),
    bag: svg('<path d="M6 8h12l1 13H5L6 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>'),
    box: svg('<path d="m4 7 8-4 8 4-8 4-8-4Z"/><path d="M4 7v10l8 4 8-4V7M12 11v10"/>'),
    clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
    alert: svg('<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5M12 18h.01"/>'),
    chat: svg('<path d="M21 15a4 4 0 0 1-4 4H8l-5 3 1.7-5A8 8 0 1 1 21 15Z"/>'),
    card: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h5"/><circle cx="17" cy="16" r="2"/>'),
    file: svg('<path d="M6 2h9l4 4v16H6Z"/><path d="M14 2v5h5M9 13h6M9 17h4"/><circle cx="17" cy="18" r="2"/><path d="M17 15v1"/>'),
    calendar: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>'),
    shield: svg('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-5"/>'),
    bank: svg('<path d="m3 9 9-5 9 5M5 10h14M6 10v7M10 10v7M14 10v7M18 10v7M4 18h16M3 21h18"/>'),
    whatsapp: svg('<path d="M20.5 11.8a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.3-4.7A8.5 8.5 0 1 1 20.5 11.8Z"/><path d="M8.1 7.7c.3-.5.6-.5.9-.5h.4c.2 0 .4.1.5.4l.8 1.9c.1.3.1.5-.1.7l-.6.8c-.2.2-.2.4 0 .7.5 1 1.3 1.8 2.3 2.4.3.2.5.2.7-.1l.9-1.1c.2-.2.4-.3.7-.2l1.9.9c.3.1.5.2.5.4 0 .2 0 1-.5 1.6-.5.7-1.5 1.2-2.4 1.2-.7 0-1.7-.2-3.3-1-2.8-1.4-4.6-4.8-4.7-5-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 1.1-2.3Z"/>')
  };
  const orders = [
    ['ORD-2025-00089','30 Jul, 2025','08:45 AM','Delivered','₹6,240','12 items','View details'],
    ['ORD-2025-00088','28 Jul, 2025','11:20 AM','Active','₹4,320','8 items','View details'],
    ['ORD-2025-00087','26 Jul, 2025','03:15 PM','Pending','₹3,960','7 items','View details'],
    ['ORD-2025-00086','22 Jul, 2025','10:05 AM','Delivered','₹5,750','11 items','↻ Reorder'],
    ['ORD-2025-00085','18 Jul, 2025','02:35 PM','Delivered','₹4,330','9 items','↻ Reorder'],
    ['ORD-2025-00084','15 Jul, 2025','09:50 AM','Cancelled','₹2,400','5 items','View details']
  ];
  const orderRows = orders.map(o => `<tr class="order-row" data-status="${o[3].toLowerCase()}"><td>${o[0]}</td><td>${o[1]}<div class="sub">${o[2]}</div></td><td><span class="v4-status ${o[3]==='Active'?'active-order':o[3].toLowerCase()}">${o[3]}</span></td><td><strong>${o[4]}</strong><div class="sub">${o[5]}</div></td><td><button class="v4-action">${o[6]}　›</button></td></tr>`).join('');
  purchases.innerHTML = `
    <div class="v4-stats">
      <div class="v4-stat"><div class="v4-icon">${icons.wallet}</div><div class="label">This month purchased</div><div class="value">₹24,600</div><div class="note green">⌃　12% vs last month</div></div>
      <div class="v4-stat"><div class="v4-icon">${icons.bag}</div><div class="label">Open orders</div><div class="value">2</div><div class="note green">View open orders　›</div></div>
      <div class="v4-stat"><div class="v4-icon">${icons.box}</div><div class="label">Delivered</div><div class="value">8</div><div class="note">In last 30 days</div></div>
      <div class="v4-stat"><div class="v4-icon">${icons.clock}</div><div class="label">Pending / Active</div><div class="value">2</div><div class="note">Awaiting updates</div></div>
    </div>
    <div class="v4-layout">
      <section class="v4-orders">
        <div class="v4-toolbar"><button class="v4-filter active" data-filter="all">All</button><button class="v4-filter" data-filter="active">Active</button><button class="v4-filter" data-filter="delivered">Delivered</button><button class="v4-filter" data-filter="pending">Pending</button><button class="v4-filter" data-filter="cancelled">Cancelled</button><input class="v4-search" placeholder="⌕  Search by Order ID or product…"><button class="v4-filter-btn">☷　Filters</button></div>
        <table class="v4-table"><thead><tr><th>Order ID</th><th>Date　↓</th><th>Status</th><th>Total</th><th>Action</th></tr></thead><tbody>${orderRows}</tbody></table>
        <button class="v4-view-all">View all orders　⌄</button>
      </section>
      <aside><div class="v4-help"><h3>Need help with an order?</h3><p>Manage your orders or get assistance</p><div class="v4-help-card">
        <div class="v4-help-row"><span class="circle">${icons.box}</span><div><strong>Reorder from<br>previous purchase</strong><small>Quickly add items from<br>your past orders</small></div><b>›</b></div>
        <div class="v4-help-row"><span class="circle">${icons.alert}</span><div><strong>Raise order issue</strong><small>Report missing, damaged<br>or wrong items</small></div><b>›</b></div>
        <div class="v4-help-row"><span class="circle">${icons.chat}</span><div><strong>Ask on WhatsApp</strong><small>Chat with us for quick<br>order support</small></div><b>›</b></div>
      </div></div><div class="v4-trust">♢　<div><strong>100% Genuine Products</strong><br>Secure & Easy Ordering</div></div></aside>
    </div>`;
  purchases.querySelectorAll('.v4-filter').forEach(button => button.addEventListener('click', () => {
    purchases.querySelectorAll('.v4-filter').forEach(x => x.classList.remove('active'));
    button.classList.add('active');
    const filter = button.dataset.filter;
    purchases.querySelectorAll('.order-row').forEach(row => row.hidden = filter !== 'all' && row.dataset.status !== filter);
  }));
  purchases.querySelector('.v4-search').addEventListener('input', e => {
    const query = e.target.value.toLowerCase();
    purchases.querySelectorAll('.order-row').forEach(row => row.hidden = !row.textContent.toLowerCase().includes(query));
  });
  purchases.querySelectorAll('.v4-action,.v4-help-row,.v4-filter-btn,.v4-view-all').forEach(button => button.addEventListener('click', () => win.showToast?.('Action opened (demo)')));
  const payCards = doc.querySelectorAll('#view-payments .stat-card');
  [icons.wallet,icons.card,icons.file,icons.calendar].forEach((icon,index) => payCards[index]?.insertAdjacentHTML('afterbegin',`<span class="v4-pay-icon">${icon}</span>`));
  doc.querySelectorAll('#paymentsBody tr').forEach(row => {
    const modeCell = row.children[1];
    const isUpi = modeCell.textContent.includes('UPI');
    modeCell.insertAdjacentHTML('afterbegin',`<span class="mode-icon ${isUpi?'upi':''}">${isUpi?'<strong>◢</strong>':icons.bank}</span>`);
  });
  const historyPanel = doc.querySelector('#paymentsBody')?.closest('.panel');
  historyPanel?.insertAdjacentHTML('beforeend',`<div class="secure-note">${icons.shield} All payments are secure and encrypted</div>`);
  const balanceCard = doc.querySelector('#view-payments .balance-card');
  balanceCard?.querySelector('.balance-total')?.insertAdjacentHTML('beforebegin','<div class="balance-label">Total balance due</div>');
  const dueNote = balanceCard?.querySelector('.balance-due-note');
  if(dueNote) dueNote.innerHTML = `${icons.calendar} ${dueNote.textContent.replace('2026','2025')}`;
  balanceCard?.querySelector('.btn-row-2')?.insertAdjacentHTML('beforebegin','<div class="pay-or">Or</div>');
  const whatsappButton = doc.querySelector('.top-actions .action-btn:nth-child(2) .ui-icon');
  if (whatsappButton) whatsappButton.innerHTML = icons.whatsapp;
  const cartCount = doc.getElementById('cartCount');
  const cartTotal = doc.getElementById('cartTotal');
  if (cartCount) cartCount.textContent = '3 items';
  if (cartTotal) cartTotal.textContent = '₹1,680';
  if (location.hash === '#purchases') win.switchView?.('purchases');
  if (location.hash === '#payments') win.switchView?.('payments');
  };
  enhance();
});
</script>
</body>
</html>
