<!doctype html>
<!--
  Short GitHub Pages entry point.
  Keeps /retails-overview/ in the address bar while rendering the canonical
  discovery hub. The injected <base> keeps every screen/version link relative
  to discovery/, exactly as it is when discovery/index.html is opened directly.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foodbridge Module Retails — Discovery Prototype</title>
  <link rel="canonical" href="https://kdansari02.github.io/retails-overview/" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f7f9;
      color: #16181d;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: #128a43; font-weight: 700; }
  </style>
</head>
<body>
  <p id="loading">Loading all prototype versions…</p>
  <script>
    fetch('discovery/index.html?landing=all-versions', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('Hub could not be loaded');
        return response.text();
      })
      .then(function (html) {
        html = html.replace('<head>', '<head><base href="discovery/">');
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        document.getElementById('loading').innerHTML =
          'Please <a href="discovery/index.html?landing=all-versions">open the complete version hub</a>.';
      });
  </script>
</body>
</html>
